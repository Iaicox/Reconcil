# Self-host stack (P10, 00-overview §5): the whole product on the customer's
# infrastructure. Outbound traffic is limited to chain-data and price providers.
#
# stdio mode for Claude Desktop/Code runs the same image:
#   docker compose run --rm mcp-server node apps/mcp-server/dist/stdio.js

name: reconcil # pin the Compose project name (else it tracks the directory)

services:
  postgres:
    image: postgres:16
    environment:
      # Renamed from pet_crypto: POSTGRES_DB only takes effect on an empty data dir.
      # Existing volume? rename in-DB, or `docker compose down -v` to start clean:
      #   docker compose exec postgres psql -U postgres -c 'ALTER DATABASE pet_crypto RENAME TO reconcil'
      POSTGRES_DB: reconcil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432" # local development convenience

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-server:
    build: .
    command: node apps/mcp-server/dist/http.js
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/reconcil
      REDIS_URL: redis://redis:6379
      SELF_HOST_TENANT_SLUG: ${SELF_HOST_TENANT_SLUG:-self-host}
      SELF_HOST_TENANT_NAME: ${SELF_HOST_TENANT_NAME:-Self-hosted}
    ports:
      # PORT (config.ts default 8484) is env_file-fed to the app; a hardcoded
      # "8484:8484" here would silently desync from a PORT override (the
      # container listens on PORT but compose still publishes 8484) — mirror
      # the same default so both sides move together.
      - "${PORT:-8484}:${PORT:-8484}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports:/app/exports
      # Optional: mount a host directory of trusted invoice CSVs read-only to use
      # recon_import_invoices' `file_path` input, and set RECONCIL_IMPORT_DIR=/app/imports.
      # Left commented ⇒ file_path imports stay fail-closed (inline `content` still works).
      #   - ./imports:/app/imports:ro

  worker:
    build: .
    command: node apps/worker/dist/main.js
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/reconcil
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports:/app/exports

volumes:
  pgdata:
  exports:
