# CI plan: docs/architecture/04-testing.md §7. Jobs: `check`, `test`, `schema-parity`,
# `integration` (testcontainers Postgres), plus the live-LLM `evals-smoke` (PR) and
# `evals-full` (manual / pre-demo) — the only jobs that use ANTHROPIC_API_KEY /
# ANTHROPIC_BASE_URL.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly ecosystem-drift canary for the jobs that cost nothing to run — the
    # deterministic ones plus `e2e-smoke` (see its own comment: it needs no API key, and
    # went its whole life un-run). `evals-full` is deliberately NOT on this trigger: it is
    # 30 cases x 3 runs of live LLM traffic, and running it against an unchanged `main`
    # bought nothing while draining the API budget.
    - cron: '0 6 * * 1' # Mondays (UTC)
  workflow_dispatch:
    inputs:
      run_evals:
        description: 'Run evals-full (live LLM traffic — this is the job that costs money)'
        type: boolean
        default: true
      run_e2e:
        description: 'Run e2e-smoke (real compose stack; no API key, free)'
        type: boolean
        default: true
      suite:
        # `choice`, not `string`: the value reaches a `run:` step, and a free-form input
        # interpolated into a shell script is a script-injection vector — in the one job
        # that holds ANTHROPIC_API_KEY. DATASETS in apps/cli/src/evals/args.ts has one
        # entry today; add options here when a second suite lands.
        description: 'Eval suite'
        type: choice
        options: [core]
        default: core
      runs:
        # 3 is the default deliberately: the trajectory gate is majority-of-3 and the
        # safety gates are all-runs, so a lower value makes a cheap run a conscious
        # choice rather than a silent weakening of what the gate means.
        description: 'Runs per case (3 = the real gate; 1 = a cheap look, weaker gate)'
        type: choice
        options: ['3', '1']
        default: '3'

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# every job only checks out and runs — none writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SHA-pinned, unlike the actions/* refs: GitHub-owned actions ship as immutable
      # packages (their tags cannot move), this third-party one does not — and a moved tag
      # would be arbitrary code in jobs that later hold ANTHROPIC_API_KEY. Dependabot
      # updates SHA pins and keeps the trailing version comment in sync.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build = tsc -b (project references) over src only; depcruise needs the
      # resulting dist entrypoints to resolve cross-package imports. typecheck
      # additionally covers test/ (tsconfig.test.json, task-14) — build alone
      # does not, so it must run as its own step for the gate to mean anything.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # The root `scripts/` and `.dependency-cruiser.cjs` belong to no workspace package, so
      # neither turbo task above reaches them: CI ran them (below) without ever checking
      # them. `tsconfig.scripts.json` and a root eslint block close that.
      - run: pnpm typecheck:scripts
      - run: pnpm lint:scripts
      - run: pnpm depcruise
      # ADR-011 transitive guard: depcruise skips node_modules, so scan the full lockfile
      # for signing/key-material packages (needs only the lockfile + cruiser config).
      - run: pnpm check:supply-chain
      # Unit coverage for the guard's two lockfile parsers (node:test, no new deps) — this
      # IS the ADR-011 enforcement, so its own parsing blind spots matter.
      - run: pnpm test:scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Drizzle migrations and docs/architecture/schema.sql must stay structurally
  # identical (ADR-002 parity acceptance test, automated). Needs only docker.
  schema-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-schema-parity.sh

  # Testcontainers spins its own Postgres per suite (needs only Docker, present on
  # ubuntu-latest). Runs the db + ingestion + ledger + pricing + mcp-tools +
  # mcp-server + evals *.itest.ts suites that the hermetic `test` job excludes.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @reconcil/db test:integration
      - run: pnpm --filter @reconcil/ingestion test:integration
      - run: pnpm --filter @reconcil/ledger test:integration
      - run: pnpm --filter @reconcil/pricing test:integration
      - run: pnpm --filter @reconcil/mcp-tools test:integration
      - run: pnpm --filter @reconcil/mcp-server test:integration
      # Golden-wallet reconciliation (native balance == recorded eth_get_balance) and the
      # DB-derived ground-truth numbers (numbers.itest.ts) — deterministic, no LLM key.
      - run: pnpm --filter @reconcil/evals test:integration
      # The eval SEEDER's own coverage: ledger_status reads ingestion_checkpoints, and a
      # seeder that leaves them empty tells every case the tenant has no wallets. Only a
      # real database shows that, so it cannot live in the hermetic suite. No LLM key.
      - run: pnpm --filter @reconcil/cli test:integration

  # Resolve secret presence into a job output. A job-level `if:` can't reference secrets.*,
  # but a step expression can — so the eval jobs gate on this output and SKIP (grey) when
  # ANTHROPIC_API_KEY is unset, instead of running and failing red at the key check.
  evals-preflight:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.k.outputs.has_key }}
    steps:
      - id: k
        run: echo "has_key=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  # Live agent smoke (6 cases × 1 run): the only cheap catch for contract/prompt drift.
  # Runs only when the secret exists AND on a same-repo PR (fork PRs have no secrets).
  # Docker (testcontainers) is present on ubuntu-latest; the runner spins its own throwaway
  # Postgres. ANTHROPIC_API_KEY (secret) + ANTHROPIC_BASE_URL (repo variable, optional
  # gateway; falls back to https://api.anthropic.com when unset) are used here and in
  # evals-full, nowhere else.
  evals-smoke:
    needs: evals-preflight
    if: needs.evals-preflight.outputs.has_key == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @reconcil/cli evals -- --smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional gateway for Anthropic traffic; unset repo variable ⇒ the public API host.
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}

  # Full suite (30 cases × 3 runs) + published scorecard. On demand only (and pre-demo) —
  # never on every PR, and no longer nightly (cost: it is the only job that spends real API
  # budget, and `main` does not change on most days). Applies the demo-readiness gate (§6):
  # a failure exits non-zero and marks the run red.
  evals-full:
    needs: evals-preflight
    if: needs.evals-preflight.outputs.has_key == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # SUITE/RUNS arrive as environment variables, never as ${{ }} inside the script:
      # expression interpolation is textual substitution done BEFORE the shell parses the
      # line, so a value containing a quote would run arbitrary commands here. This file
      # already SHA-pins its third-party action for the same reason ("a moved tag would be
      # arbitrary code in jobs that later hold ANTHROPIC_API_KEY").
      - run: pnpm --filter @reconcil/cli evals -- --suite "$SUITE" --runs "$RUNS" --out eval-reports
        env:
          SUITE: ${{ inputs.suite }}
          RUNS: ${{ inputs.runs }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional gateway for Anthropic traffic; unset repo variable ⇒ the public API host.
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-scorecard
          # `--out` is resolved by the CLI relative to its own package, so the reports land
          # in apps/cli/eval-reports — not the repo root. Uploading "eval-reports/" matched
          # nothing ("No files were found with the provided path"), so the scorecard was
          # never actually captured on any run.
          path: apps/cli/eval-reports/

  # Pre-release E2E smoke (04-testing.md §1, bottom pyramid layer): brings up the REAL
  # compose stack (docker-compose.yml + Dockerfile image), connects a stdio MCP client, and
  # asserts three tool calls' envelopes — proof the P10 self-host story boots. Never per-PR,
  # so it adds zero per-change CI cost. No API key. Docker is present on ubuntu-latest; the
  # smoke tears the stack down (`compose down -v`) itself.
  #
  # ALSO on the weekly canary, not dispatch only. This job had never executed once before
  # 2026-09-07 — the dispatch that ran it was the first workflow_dispatch in the repository's
  # history, and it failed: the documented `cp .env.example .env && docker compose up` path
  # had been broken by an env-schema change with nothing watching it. A self-host story that
  # is only ever checked when someone remembers to check it is a story that rots silently,
  # and this is the one job that proves P10. It is free, so the weekly run costs nothing.
  e2e-smoke:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    runs-on: ubuntu-latest
    # waitForSchema self-caps at 120s, but `up --build` / the tool calls / `down -v` don't;
    # a hung docker/stdio would otherwise ride the 360-min default. Happy path is ~5-10 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # compose needs a non-empty POSTGRES_PASSWORD; .env.example ships one (change-me).
      - run: cp .env.example .env
      - run: pnpm smoke:compose
