# CI plan: docs/architecture/04-testing.md §7. Jobs: `check`, `test`, `schema-parity`,
# `integration` (testcontainers Postgres), plus the live-LLM `evals-smoke` (PR) and
# `evals-full` (nightly + manual) — the only jobs that use ANTHROPIC_API_KEY.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # nightly evals-full (UTC)
  workflow_dispatch: {}

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# every job only checks out and runs — none writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build = tsc -b (project references): typecheck happens here, and
      # depcruise needs dist entrypoints to resolve cross-package imports
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm depcruise

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Drizzle migrations and docs/architecture/schema.sql must stay structurally
  # identical (ADR-002 parity acceptance test, automated). Needs only docker.
  schema-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-schema-parity.sh

  # Testcontainers spins its own Postgres per suite (needs only Docker, present on
  # ubuntu-latest). Runs the db + ingestion + ledger + pricing + mcp-tools *.itest.ts
  # suites that the hermetic `test` job excludes.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @pet-crypto/db test:integration
      - run: pnpm --filter @pet-crypto/ingestion test:integration
      - run: pnpm --filter @pet-crypto/ledger test:integration
      - run: pnpm --filter @pet-crypto/pricing test:integration
      - run: pnpm --filter @pet-crypto/mcp-tools test:integration
      # Golden-wallet reconciliation (native balance == recorded eth_get_balance) and the
      # DB-derived ground-truth numbers (numbers.itest.ts) — deterministic, no LLM key.
      - run: pnpm --filter @pet-crypto/evals test:integration

  # Live agent smoke (5 cases × 1 run): the only cheap catch for contract/prompt drift.
  # Same-repo PRs only — fork PRs have no secrets, so this is skipped there rather than
  # failing. Docker (testcontainers) is present on ubuntu-latest; the runner spins its own
  # throwaway Postgres. ANTHROPIC_API_KEY is used here and in evals-full, nowhere else.
  evals-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @pet-crypto/cli evals -- --smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # Full suite (30 cases × 3 runs) + published scorecard. Nightly and on-demand only —
  # never on every PR (cost). Applies the demo-readiness gate (§6): a failure exits
  # non-zero and marks the run red.
  evals-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @pet-crypto/cli evals -- --suite core --runs 3 --out eval-reports
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard
          path: eval-reports/
