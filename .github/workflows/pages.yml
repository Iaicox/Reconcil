# Deploys the validation-phase landing page (site/) to GitHub Pages. Independent of ci.yml:
# path-filtered to site/** so it never runs on backend-only changes, and the site is a
# standalone npm project (not the pnpm workspace), so nothing here touches the product build.
#
# One-time repo setup: Settings -> Pages -> Source = GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Least privilege + the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Project site lives under github.io/Reconcil/ — prefix routes and assets.
          NEXT_PUBLIC_BASE_PATH: /Reconcil
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
