# PR gate for the landing page (site/) — Playwright e2e against the built static export.
# Mirrors pages.yml conventions: path-filtered to site/**, standalone npm project, nothing
# here touches the product build. Deploy stays in pages.yml (push to main).
name: site-ci

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # ADR-011 transitive guard (same script ci.yml runs): the checker has zero deps of
      # its own (just node:fs/node:path + the root cruiser config), so it runs against a
      # plain checkout — no pnpm/root install needed in this standalone npm job.
      - name: ADR-011 supply-chain guard
        working-directory: .
        run: node scripts/check-no-signing-libs.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `npm test` builds the static export first, then runs the suite against it —
      # the same artifact shape pages.yml deploys (minus the /Reconcil basePath).
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
