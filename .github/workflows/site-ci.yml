# PR gate for the landing page (site/) — Playwright e2e against the built static export.
# Mirrors pages.yml conventions: path-filtered to site/**, standalone npm project, nothing
# here touches the product build. Deploy stays in pages.yml (push to main).
name: site-ci

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `npm test` builds the static export first, then runs the suite against it —
      # the same artifact shape pages.yml deploys (minus the /Reconcil basePath).
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
