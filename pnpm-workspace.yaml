# ee/ is deliberately NOT a workspace member: reserved for post-gate closed
# SaaS scaffolding, empty pre-gate (ADR-013).
packages:
  - apps/*
  - packages/*

allowBuilds:
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

# typescript is capped at 6.x: 7.x is the native (tsgo) port and typescript-eslint
# peers require <6.1. @types/node tracks the Node 22 runtime (engines, Dockerfile).
catalog:
  "@testcontainers/postgresql": ^11.0.0
  "@types/node": ^22.10.0
  "@types/pg": ^8.20.0
  "decimal.js": ^10.4.0
  "drizzle-orm": ^0.45.2
  eslint: ^10.0.0
  fast-check: ^4.9.0
  pg: ^8.22.0
  tsx: ^4.19.0
  typescript: ~6.0.3
  vitest: ^4.1.0
  zod: ^4.0.0

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.114.0'

onlyBuiltDependencies:
  - esbuild
