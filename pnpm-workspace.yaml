# ee/ is deliberately NOT a workspace member: reserved for post-gate closed
# SaaS scaffolding, empty pre-gate (ADR-013).
packages:
  - apps/*
  - packages/*

allowBuilds:
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

# typescript is capped at 6.x: 7.x is the native (tsgo) port and typescript-eslint
# peers require <6.1. @types/node tracks the Node 24 runtime (.nvmrc, engines, Dockerfile).
catalog:
  "@testcontainers/postgresql": ^12.0.0
  "@types/node": ^24.0.0
  "@types/pg": ^8.20.0
  "decimal.js": ^10.4.0
  "drizzle-orm": ^0.45.2
  eslint: ^10.0.0
  fast-check: ^4.9.0
  pg: ^8.22.0
  tsx: ^4.19.0
  typescript: ~6.0.3
  # Floor stated, not merely satisfied: 4.1.10 is inside ^4.1.0 and closes
  # GHSA-82fw-gwwq-j7x9 (@vitest/mocker path traversal) only at 4.1.11, so a plain install would
  # keep the vulnerable resolution with a green --frozen-lockfile (09-known-gaps.md,
  # "Regenerating pnpm-lock.yaml does not reapply in-range security bumps").
  vitest: ^4.1.11
  zod: ^4.0.0

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.114.0'

# drizzle-kit (latest) still bundles the deprecated @esbuild-kit loader, which pins
# esbuild ~0.18 (GHSA-67mh-4wv8-2f99); the transform API it uses is stable in 0.25+.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  # vite pins postcss at 8.5.19, which is inside its own range but below the fix for
  # GHSA (postcss <= 8.5.22). `pnpm update` will not move a transitive that already
  # satisfies its parent, so the floor has to be stated here. postcss >= 8.5.23 also
  # requires nanoid ^3.3.18, which closes that advisory in the same step.
  postcss: ^8.5.23

onlyBuiltDependencies:
  - esbuild
