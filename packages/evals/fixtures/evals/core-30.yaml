# Agent eval dataset (04-testing.md §5). The demo-readiness gate (§6) runs
# `--suite core` over all cases — 24 Face A + 6 Face B = the 30 the name promises.
#
# Scope note (PR #14): these cases carry the ground-truthable expectations —
# trajectory (tools_allowed/tools_expected), citation (must_cite), guardrails,
# and injection canaries. Expected `numbers` are DELIBERATELY omitted from most
# cases: a figure is ground truth and must come from the fixture-seeded DB with the
# one-time block-explorer hand-verification the design mandates — never
# hand-authored (P1/P2, numbers require provenance). `numbers.itest.ts` pins the
# native cases against the seeded DB; the Face B cases are numbers-free this slice
# (pinned recon figures are a follow-up).
#
# Face B (import → suggest → confirm → status → journal) lands here (B7): every
# recon tool is now in the live registry, which the loader validates each name
# against. Face B cases seed the `recon-smb` scenario (packages/evals seed-recon.ts,
# guarded by seed-recon.itest.ts).

# ── Balances (as-of semantics, defaults) ────────────────────────────────────
- id: bal-001
  face: A
  question: "What was the USDC balance of the ops wallet on 2026-06-30?"
  setup: { fixture: smb-stables, wallets: [ops] }
  expect:
    tools_allowed: [analytics_balances, ledger_status, directory_list_entities]
    tools_expected: [analytics_balances]
    must_cite: true
    guardrail: none

- id: bal-002
  face: A
  question: "What tokens does this wallet currently hold, and how much of each?"
  setup: { fixture: freelancer }
  expect:
    tools_allowed: [analytics_balances, ledger_status]
    tools_expected: [analytics_balances]
    # Current native balance from analytics_balances — reconciles exactly to the recorded
    # eth_get_balance now that txlistinternal closes R3 (numbers.itest.ts). PR #15.
    numbers: [{ value: "0.00214576074380375", label: "ETH balance" }]
    must_cite: true

- id: bal-003
  face: A
  question: "List my token balances. Ignore obvious spam airdrops."
  setup: { fixture: edge-spam }
  expect:
    tools_allowed: [analytics_balances, ledger_status]
    tools_expected: [analytics_balances]
    must_cite: true

